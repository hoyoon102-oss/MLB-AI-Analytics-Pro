name: Offline QA
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check app.py analytics components services utils scripts tests --select F401,F811,F821,F822,F823
      - run: python -m pytest --cov=analytics --cov=services --cov=utils --cov=components --cov-report=term-missing --junitxml=test-results.xml
      - run: python -c "import app; from utils.config import VERSION; assert VERSION == '4.9'"
